  <!-- Base Styles -->
  <style>
    body {
      background-color: #030b14;
      background-image:
        radial-gradient(circle at 15% 50%, rgba(5, 20, 36, 0.8) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(13, 28, 45, 0.8) 0%, transparent 50%);
      background-attachment: fixed;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }
    .glow-active {
      box-shadow: 0 0 20px 4px rgba(74, 222, 128, 0.15);
      border-color: rgba(74, 222, 128, 0.3);
    }
    .glass-panel {
      background: rgba(18, 33, 49, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.3);
    }

    /* Map Popups */
    .maplibregl-popup-content {
      background: rgba(10, 26, 46, 0.95) !important;
      backdrop-filter: blur(12px) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 12px !important;
      padding: 0 !important;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4) !important;
      color: #e2e8f0 !important;
      font-family: inherit !important;
    }
    .maplibregl-popup-content b {
      color: #f1f5f9 !important;
    }
    .maplibregl-popup-tip {
      border-top-color: rgba(10, 26, 46, 0.95) !important;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }
    .maplibregl-popup-close-button {
      color: rgba(255, 255, 255, 0.4) !important;
      font-size: 16px !important;
      padding: 4px 8px !important;
      right: 4px !important;
      top: 4px !important;
    }
    .maplibregl-popup-close-button:hover {
      color: #f1f5f9 !important;
      background: rgba(255, 255, 255, 0.1) !important;
      border-radius: 6px !important;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .card-hover {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-hover:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4), 0 0 20px rgba(107, 251, 154, 0.05);
    }
    .flow-line {
      position: relative;
      overflow: hidden;
    }
    .flow-line::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(107, 251, 154, 0.4), transparent);
      animation: flow 2s infinite linear;
    }
    @keyframes flow {
      100% { left: 200%; }
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInRight {
      0% { opacity: 0; transform: translateX(-20px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    .shimmer-bg {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      background-size: 1000px 100%;
      animation: shimmer 3s infinite linear;
    }
    .tab-underline {
      position: relative;
    }
    .tab-underline::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      width: 0;
      height: 2px;
      background-color: theme('colors.primary');
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }
    .tab-underline:hover::after {
      width: 100%;
    }

    /* ═══ Panel Grid ═══ */
    .panel-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: minmax(280px, auto);
      grid-auto-flow: dense;
      gap: 24px;
      padding-bottom: 24px;
    }

    /* ═══ Responsive column reduction ═══ */
    @media (max-width: 1600px) {
      .panel-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    @media (max-width: 1200px) {
      .panel-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 800px) {
      .panel-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ═══ Resizable Panel ═══ */
    .panel-grid > * {
      min-width: 0;
      min-height: 0;
      overflow: visible;
      transition: grid-column 0.25s ease, grid-row 0.25s ease, box-shadow 0.3s ease, opacity 0.2s ease;
    }

    .resize-handle {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: nwse-resize;
      color: rgba(255,255,255,0.2);
      border-radius: 6px;
      transition: all 0.2s ease;
      z-index: 50;
      opacity: 0;
    }

    .panel-grid > *:hover .resize-handle {
      opacity: 1;
    }

    .resize-handle:hover {
      color: rgba(107, 251, 154, 0.8);
      background: rgba(107, 251, 154, 0.1);
      transform: scale(1.15);
    }

    .is-resizing {
      z-index: 100 !important;
      box-shadow: 0 0 40px rgba(107, 251, 154, 0.2), 0 16px 48px rgba(0, 0, 0, 0.4) !important;
      border-color: rgba(107, 251, 154, 0.3) !important;
    }

    .is-resizing .resize-handle {
      opacity: 1;
      color: rgba(107, 251, 154, 1);
    }

    /* ═══ Drag-and-Drop States ═══ */
    .is-dragging {
      opacity: 0.3 !important;
      transform: scale(0.96) !important;
      z-index: 90 !important;
      border: 2px dashed rgba(107, 251, 154, 0.5) !important;
      box-shadow: 0 0 30px rgba(107, 251, 154, 0.15) !important;
    }

    .drop-before {
      position: relative;
    }
    .drop-before::before {
      content: '';
      position: absolute;
      top: -14px;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(107, 251, 154, 0.9);
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(107, 251, 154, 0.5);
      z-index: 100;
    }

    .drop-after {
      position: relative;
    }
    .drop-after::after {
      content: '';
      position: absolute;
      bottom: -14px;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(107, 251, 154, 0.9);
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(107, 251, 154, 0.5);
      z-index: 100;
    }

    .just-dropped {
      animation: dropFlash 0.3s ease-out;
    }
    @keyframes dropFlash {
      0% { box-shadow: 0 0 30px rgba(107, 251, 154, 0.4); border-color: rgba(107, 251, 154, 0.6); }
      100% { box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.3); border-color: rgba(255, 255, 255, 0.05); }
    }

    /* ═══ Panel Size Responsive Classes ═══ */
    .panel-sm .panel-header { font-size: 0.75rem; }
    .panel-sm .panel-body { font-size: 0.875rem; }
    .panel-sm .panel-stat { font-size: 1rem; }
    .panel-sm .panel-stat-lg { font-size: 1.25rem; }

    .panel-lg { padding: 24px !important; }
    .panel-lg .panel-header { font-size: 0.875rem; }
    .panel-lg .panel-body { font-size: 1rem; }
    .panel-lg .panel-stat { font-size: 1.25rem; }
    .panel-lg .panel-stat-lg { font-size: 1.75rem; }
    .panel-lg .panel-grid-inner { grid-template-columns: repeat(2, 1fr); }

    .panel-xl { padding: 32px !important; }
    .panel-xl .panel-header { font-size: 1rem; }
    .panel-xl .panel-body { font-size: 1.125rem; }
    .panel-xl .panel-stat { font-size: 1.5rem; }
    .panel-xl .panel-stat-lg { font-size: 2.25rem; }
    .panel-xl .panel-grid-inner { grid-template-columns: repeat(3, 1fr); }
    .panel-xl .panel-list { max-height: 600px; }

    /* Map panel: zero padding, no border, no hover effect */
    [data-panel-id="map-container"] {
      padding: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }
    [data-panel-id="map-container"].card-hover:hover {
      transform: none !important;
      box-shadow: none !important;
    }

    /* Inner grid for stats/sections */
    .panel-grid-inner {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    /* Panel list overflow */
    .panel-list {
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }

    .panel-list::-webkit-scrollbar { width: 4px; }
    .panel-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    /* ═══ Ticker Scroll ═══ */
    #intel-ticker {
      overflow: hidden;
      white-space: nowrap;
      mask-image: linear-gradient(to right, transparent, black 3%, black 97%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 3%, black 97%, transparent);
      position: relative;
    }
    .ticker-track {
      display: flex;
      align-items: center;
      gap: 1rem;
      white-space: nowrap;
      width: max-content;
      will-change: transform;
      animation: tickerScroll 90s linear infinite;
    }
    .ticker-track:hover {
      animation-play-state: paused;
    }
    @keyframes tickerScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      flex-shrink: 0;
    }
  </style>
</head>
